[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2.1", features = [] }

[dependencies]
tauri = { version = "^2.1", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-m3 = "0.3.2"
# `cookies` is the correct feature name (not `cookie-store`) — it enables
# reqwest's persistent cookie jar so the HttpOnly auth_token cookie survives
# the app process being killed and is re-sent on the next cold launch,
# allowing restoreSession() to succeed without forcing re-login.
tauri-plugin-http = { version = "2.5.9", features = ["cookies"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
